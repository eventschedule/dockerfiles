# The scheme the visitor used. Behind an HTTPS reverse proxy that is the proxy's
# X-Forwarded-Proto, not this server's own $scheme, which is always http here: overwriting it
# told the app every request was plain http. The app believes it only from TRUSTED_PROXIES.
map $http_x_forwarded_proto $forwarded_proto {
  default $http_x_forwarded_proto;
  ""      $scheme;
}

server {
  listen 80 default_server;
  server_name _;
  root /var/www/html/public;
  index index.php index.html;
  client_max_body_size 500M;

  # Map legacy /register to the real /sign_up
  location = /register {
    return 308 /sign_up;
  }

  location / {
    try_files $uri $uri/ /index.php?$query_string;
  }

  location ~ \.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_read_timeout 300;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_param HTTP_X_FORWARDED_PROTO $forwarded_proto;
    fastcgi_pass app:9000;
  }

  location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
    try_files $uri =404;
    access_log off;
    expires max;
  }
}

